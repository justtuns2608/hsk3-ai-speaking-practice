<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK3 Speaking Practice - AI Chấm Nói</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #111; }
  h1 { text-align: center; color: #2563eb; }
  #app { max-width: 750px; margin: 0 auto; background: #fff; padding: 20px 30px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  button { margin: 8px; padding: 10px 18px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; transition: 0.3s; }
  button:hover { background: #1e40af; }
  #question { font-size: 22px; margin: 15px 0; color: #111; font-weight: 600; }
  #transcript { width: 100%; height: 80px; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
  #aiResult { margin-top: 18px; padding: 15px; background: #f3f4f6; border-radius: 10px; white-space: pre-line; }
  .correct { color: green; }
  .incorrect { color: red; }
  ul { margin: 0; padding-left: 25px; }
  small { display: block; color: #374151; margin-left: 8px; }
</style>
</head>
<body>
<h1>💬 Luyện nói HSK3 cùng AI</h1>
<div id="app">
  <div id="question">Đang tải câu hỏi...</div>
  <button id="speakBtn">🎧 Nghe lại câu hỏi</button>
  <button id="recordBtn">🎙️ Bắt đầu ghi âm</button>
  <button id="stopBtn" disabled>⏹️ Dừng ghi</button>
  <button id="analyzeBtn" disabled>🧠 Gửi lên AI chấm</button>
  <br>
  <textarea id="transcript" placeholder="Phần bạn nói sẽ hiện ở đây hoặc bạn có thể nhập trực tiếp..."></textarea>
  <div id="aiResult">Chưa có phản hồi.</div>
  <button id="nextBtn">➡️ Câu tiếp theo</button>
</div>

<script>
let questions = [];
let idx = 0;
let recognition;
let speechSynthesisUtterance;

async function loadQuestions() {
  const res = await fetch("questions.json");
  questions = await res.json();
  showQuestion();
}

function showQuestion() {
  document.getElementById("question").textContent = questions[idx] || "Hết câu hỏi rồi!";
  document.getElementById("transcript").value = "";
  document.getElementById("aiResult").textContent = "Chưa có phản hồi.";
  speakQuestion();
}

function speakQuestion() {
  const text = questions[idx];
  if (!text) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-CN";
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

document.getElementById("speakBtn").onclick = speakQuestion;

document.getElementById("nextBtn").onclick = () => {
  idx = (idx + 1) % questions.length;
  showQuestion();
};

document.getElementById("recordBtn").onclick = () => {
  if (!("webkitSpeechRecognition" in window)) {
    alert("Trình duyệt của bạn không hỗ trợ ghi âm trực tiếp.");
    return;
  }
  recognition = new webkitSpeechRecognition();
  recognition.lang = "zh-CN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.start();
  document.getElementById("recordBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;
  document.getElementById("aiResult").textContent = "🎙️ Đang ghi âm...";
  recognition.onresult = (event) => {
    document.getElementById("transcript").value = event.results[0][0].transcript;
    document.getElementById("aiResult").textContent = "✅ Đã ghi lại, sẵn sàng gửi lên AI.";
    document.getElementById("analyzeBtn").disabled = false;
  };
};

document.getElementById("stopBtn").onclick = () => {
  if (recognition) recognition.stop();
  document.getElementById("recordBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
};

document.getElementById("analyzeBtn").onclick = async () => {
  const question = questions[idx];
  const transcript = document.getElementById("transcript").value.trim();
  const aiResult = document.getElementById("aiResult");
  if (!transcript) { aiResult.textContent = "Chưa có bản ghi."; return; }

  aiResult.textContent = "⏳ Đang gửi lên AI (GPT-4o-mini)...";
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, transcript })
    });
    const j = await res.json();
    if (!j.ok) {
      aiResult.textContent = "Lỗi server: " + (j.error || JSON.stringify(j));
      return;
    }

    const p = j.parsed || {};
    let html = `<div><b>Đánh giá:</b> <span class="${p.verdict==='đúng'?'correct':'incorrect'}">${p.verdict || "Không rõ"}</span></div>`;
    html += `<div><b>Giải thích:</b> ${p.reason || "(Không có)"}</div>`;

    if (p.errors && Array.isArray(p.errors) && p.errors.length) {
      html += `<div><b>Lỗi:</b> ${p.errors.map(e => escapeHtml(e)).join("；")}</div>`;
    } else {
      html += `<div><b>Lỗi:</b> Không</div>`;
    }

    if (p.corrected) {
      if (typeof p.corrected === "object") {
        html += `<div><b>Câu sửa:</b> ${escapeHtml(p.corrected.sentence || "")}</div>`;
        if (p.corrected.pinyin) html += `<small>Pinyin: ${escapeHtml(p.corrected.pinyin)}</small>`;
        if (p.corrected.vietnamese) html += `<small>Việt: ${escapeHtml(p.corrected.vietnamese)}</small>`;
        // tự động đọc câu sửa
        if (p.corrected.sentence) {
          const utt = new SpeechSynthesisUtterance(p.corrected.sentence);
          utt.lang = "zh-CN";
          utt.rate = 0.9;
          speechSynthesis.speak(utt);
        }
      } else {
        html += `<div><b>Câu sửa:</b> ${escapeHtml(p.corrected)}</div>`;
      }
    } else {
      html += `<div><b>Câu sửa:</b> (Không cần sửa)</div>`;
    }

    if (p.suggestions && Array.isArray(p.suggestions) && p.suggestions.length) {
      html += `<div><b>Gợi ý khác:</b></div><ul>`;
      for (const s of p.suggestions) {
        if (typeof s === "object") {
          html += `<li>${escapeHtml(s.sentence || "")}`;
          if (s.pinyin) html += `<small>Pinyin: ${escapeHtml(s.pinyin)}</small>`;
          if (s.vietnamese) html += `<small>Việt: ${escapeHtml(s.vietnamese)}</small>`;
          html += `</li>`;
        } else {
          html += `<li>${escapeHtml(s)}</li>`;
        }
      }
      html += `</ul>`;
    } else {
      html += `<div><b>Gợi ý khác:</b> —</div>`;
    }

    aiResult.innerHTML = html;
  } catch (e) {
    document.getElementById("aiResult").textContent = "❌ Không thể kết nối tới API: " + e.message;
  }
};

function escapeHtml(str) {
  if (!str && str !== "") return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadQuestions();
</script>
</body>
</html>
